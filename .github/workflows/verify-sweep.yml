name: Verify sweep

# The whole verify suite, both builds, off the Oracle box (docs/FINDINGS_verify_
# selection.md §4; Peter's go, S259). The sweep's job is DRIFT detection: a PR
# runs only the scripts for its change class (CHANGE_PIPELINE step 5), and the
# reds a full sweep finds come from refreshes and copy merges whatever the PR
# is. Before this, those sat unnoticed for days because nothing ran the sweep.
#
# NON-BLOCKING. It gates no merge and no deploy; its output is an issue. It
# files one when a script is red twice, red-then-green (flaky), or has no result
# at all, and comments on the open one instead of opening a second. A green week
# files nothing, which is why "no result" is its own verdict: a sweep that broke
# must not read the same as a sweep that passed.
#
# ⚠️ STAGE 1 OF 2: manual only. The first runs calibrate the runner-timing
# literals (verify-loading-overlay's 250 / 8000 / 40 ms) on x86 SwiftShader;
# stage 2 adds the trigger on the refresh's completion. Not a cron: the refresh's
# own 08:00 cron has started at 17:55 and 19:20 UTC on recent Mondays.
#
# 8 shards per build, each running its scripts ONE AT A TIME on its own VM, so
# no contention (verify.js header) and no 10-minute cap. Shard membership is the
# script's index mod 8, so a new verify script joins a shard unasked. The report
# derives the expected set from the same listing, so a shard that dies, or a
# matrix that disagrees with --of, reads as "could not run", never as green.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: File or update the verify-sweep issue (turn off for calibration runs)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: verify-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false  # every shard reports, so one red doesn't hide another
      matrix:
        build: [public, full]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]  # must match --of below
    name: sweep (${{ matrix.build }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install the verify harness
        working-directory: tools/profiling
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Build the two-build site tree
        run: python3 scripts/build_site.py --src web --out _site

      # Exits 1 when a script is red twice, so the shard shows red in the run
      # list too; the upload below still runs.
      - name: Run this shard's scripts, one at a time
        run: >
          python3 scripts/verify_sweep.py run
          --build ${{ matrix.build }} --shard ${{ matrix.shard }} --of 8
          --site _site --out results/${{ matrix.build }}-${{ matrix.shard }}.jsonl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sweep-${{ matrix.build }}-${{ matrix.shard }}
          path: results/
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No artifacts at all (every shard died in setup) must reach the report as
      # an empty folder, which reads as "could not run", not stop the job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true

      - name: Build the report
        id: report
        run: |
          mkdir -p results
          python3 scripts/verify_sweep.py report --results results --body report.md --github-output "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure the label exists
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create verify-sweep \
            --description "Weekly verify sweep (verify-sweep.yml)" \
            --color D93F0B || true

      # One open issue at a time: a new red comments on it. A green week
      # comments only when an issue is open, so it can be closed.
      - name: File or update the issue
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.issue)
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.report.outputs.kind }}
          TITLE: ${{ steps.report.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$KIND" ]; then
            KIND=broken
            TITLE="⚠️ Verify sweep could not run — the report step crashed"
            echo "The report step crashed before writing a verdict. [Run log]($RUN_URL). Triage: \`docs/RUNBOOK.md\` §0g." > report.md
          fi
          open=$(gh issue list --label verify-sweep --state open --json number --jq '.[0].number // empty')
          if [ "$KIND" = green ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "This week's sweep is all green ([run]($RUN_URL)). Close this once the reds above are dealt with."
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            { echo "## $TITLE"; echo; cat report.md; } > comment.md
            gh issue comment "$open" --body-file comment.md
          else
            gh issue create --title "$TITLE" --body-file report.md --label verify-sweep
          fi

name: Evidence recheck

# Monthly re-execution of notebooks/standalone/ against live sources
# (scripts/recheck_evidence_notebooks.py), filed as a GitHub issue so the
# notification email arrives without this repo holding an SMTP credential.
#
# WHY THIS EXISTS: every notebook in notebooks/standalone/ carries invariants
# that are meant to keep PASSING — the evidence reports fail when a publisher
# FIXES the defect they document, the justification notebooks fail when a
# source moves under a rate this project ships. Nothing re-ran either kind on a
# schedule. Measured 2026-09-21: four of the five published evidence pages had
# not touched a live source since 2026-08-29, while their file mtimes read as
# the previous day because a cosmetic re-render had rewritten stored outputs.
# The detector was well built and had no trigger — the same shape as the
# `_classify` warning that logged to an unread file for ~70 days.
#
# ⚠️ A FAILURE HERE IS OFTEN GOOD NEWS. For an evidence report it most likely
# means the City fixed the defect, which is what the report was written to
# achieve — and it also means the published page at web/notebooks/ now makes a
# claim that is no longer true. Triage: docs/RUNBOOK.md §0e.
#
# REPORT-ONLY. It runs notebooks that read the network and write nothing,
# touches no data file and no branch, and cannot fail the pipeline. An issue is
# filed EVERY month even when all-green: a report that only speaks up when
# something is wrong is indistinguishable from one that has silently broken.

on:
  schedule:
    # 15th of the month, 14:00 UTC (~8am Edmonton MDT). Deliberately NOT the
    # 1st — the vintage digest owns that date, and two reports landing together
    # is how the second one gets skimmed.
    - cron: '0 14 15 * *'
  workflow_dispatch: {}        # manual "Run workflow" button

# Least-privilege: read the code, file the issue. No contents:write, no Pages.
permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    # Seven notebooks, each paging Socrata or pulling multi-MB PDFs. The script
    # caps each at 7 min and reports a timeout as "could not check" rather
    # than letting the job die with no issue filed. ⚠️ 7 × the per-notebook cap
    # must stay under this limit (pinned by test_recheck_evidence_notebooks.py);
    # at the old 25-min cap a third hung notebook killed the job silently.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # The script exits 0 even when notebooks moved or could not be checked —
      # the ISSUE is the output, not the exit code. A non-zero exit here would
      # mean the script itself crashed, which is a different problem.
      - name: Re-run the standalone notebooks
        id: recheck
        # `shell: bash` adds -o pipefail: without it a crash of the script is
        # masked by `tee` and surfaces one step later as a blank-title failure.
        shell: bash
        run: python scripts/recheck_evidence_notebooks.py | tee recheck.md

      # Idempotent: `gh label create` fails loudly once the label exists, which
      # is the normal case from month two onward.
      - name: Ensure the label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create evidence-recheck \
            --description "Monthly re-execution of the standalone notebooks" \
            --color 1D76DB || true

      - name: File the recheck as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.recheck.outputs.title }}" \
            --body-file recheck.md \
            --label evidence-recheck

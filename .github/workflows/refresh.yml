name: Refresh map data

# Scheduled batch refresh (docs/SPEC_deployment.md). Downloads the Edmonton
# open-data inputs, regenerates web/data/*.geojson, commits only if the data
# actually changed (git is the change detector), and deploys web/ to GitHub
# Pages. The status manifest is rewritten every run as a heartbeat so the
# schedule isn't auto-disabled after 60 days of inactivity.

on:
  schedule:
    - cron: '0 8 * * 1'      # weekly, Monday 08:00 UTC (cron is UTC, best-effort)
  workflow_dispatch: {}       # manual "Run workflow" button (also the first-run bootstrap)

# Least-privilege: write repo contents (commit regenerated data) + deploy Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes race on the push/deploy.
concurrency:
  group: refresh-map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # HEARTBEAT_TOKEN (repo secret, contents:write on this repo only) is the
      # credential the heartbeat commit pushes with — see SPEC_deployment
      # "Staying awake". GitHub auto-disables cron workflows after 60 days of
      # repo inactivity, and commits pushed with the default GITHUB_TOKEN are
      # not reliably counted as activity; a PAT push is. FALLS BACK to
      # github.token when the secret is absent, so the workflow behaves exactly
      # as before on a fork, or if the token is revoked/never set.
      #
      # Unlike GITHUB_TOKEN, a PAT push DOES trigger workflows — safe here
      # because the commit step stages `web/data` only, and deploy.yml excludes
      # `web/data/**`. Widening what gets staged would start a deploy loop.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.HEARTBEAT_TOKEN || github.token }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      # Supply-chain audit of the publish-path deps (docs/security-audit.md S5).
      # requirements-ci.txt is currently clean; this keeps it continuously
      # checked. NON-BLOCKING on purpose (continue-on-error) — a newly disclosed
      # CVE here should not halt the unattended weekly data refresh (stale-but-up
      # beats blocked for a civic map); it surfaces as a workflow warning to
      # prompt a pin bump. Drop continue-on-error to make it a hard deploy gate.
      - name: Audit CI dependencies (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements-ci.txt

      - name: Run tests (guard before regenerating)
        run: python -m pytest tests/ -q

      - name: Download source data
        run: python scripts/download_data.py

      # Unmatched-name guard (docs/FINDINGS_data_integrity_audit.md §4 / T3c):
      # neighbourhood name is the assessment<->boundary join key. A NEW assessment
      # name with no boundary silently drops that neighbourhood's assessed value
      # from the map — warn-silent in an unattended weekly run. This asserts the
      # live money-path unmatched set equals the committed baseline
      # (data/expected_unmatched.json) and FAILS the build (exit 5) on new drift,
      # so no wrong-data deploy happens and the last good data keeps serving.
      - name: Check unmatched names (guard before regenerating)
        run: python scripts/check_unmatched_names.py

      # Year-alignment guard (docs/FINDINGS_data_integrity_audit.md §3, SPEC
      # "Year alignment"): the roll year lives only in Socrata metadata, so a
      # year roll would otherwise silently apply stale rates. exit 0 = aligned,
      # 3 = hold (roll != pin: skip regen, serve committed data + banner),
      # 4 = inconclusive (metadata unreachable: proceed as aligned, warn).
      - name: Check year alignment (guard before regenerating)
        id: yearcheck
        run: |
          set +e
          python scripts/check_year_alignment.py
          code=$?
          set -e
          case $code in
            0) ;;
            3) echo "::warning::YEAR MISMATCH — holding window: keeping last committed data, setting banner. Bump ASSESSMENT_YEAR + mill_rates.json, then clear the banner (generate_status.py --clear-banner)." ;;
            4) echo "::warning::Year-alignment check inconclusive (metadata fetch/parse failed) — proceeding as aligned." ;;
            *) exit $code ;;
          esac

      - name: Regenerate web GeoJSON
        if: steps.yearcheck.outputs.result != 'hold'
        run: python main.py --skip-png    # PNG is a Phase-1 local artifact, not served

      # Guard AFTER regeneration: it reads the freshly written value_grid.json,
      # so it judges the artifact the site is about to serve. A hard failure here
      # stops the commit, and the last good data keeps serving.
      - name: Check cardinality value anchors (guard after regenerating)
        if: steps.yearcheck.outputs.result != 'hold'
        run: python scripts/check_value_anchors.py

      # Schema half of the same "did the artifact survive regeneration" question.
      # The anchors above pin what the NUMBERS look like; this pins WHICH COLUMNS
      # EXIST, against a committed baseline. It needs that memory because every
      # lens self-gates on its own column: a dropped one hides its own row and
      # publishes clean, so nothing derived from the served file alone — including
      # verify-smoke.js's B7 below — can tell a drop from a metric that has not
      # shipped yet. Adding a column only warns; losing one fails.
      - name: Check served columns (guard after regenerating)
        if: steps.yearcheck.outputs.result != 'hold'
        run: python scripts/check_served_columns.py

      # notebooks/verified/ (docs/VERIFICATION.md) re-runs the real src/ pipeline
      # independently, narrated for a human reader, and asserts invariants against
      # THIS run's data — a second, differently-shaped recomputation of the numbers
      # the site is about to publish. A failing invariant here means the pipeline
      # disagrees with itself, so like the guards above it blocks the commit rather
      # than shipping a page nobody checked. Renders to web/verified/, which is DATA
      # (regenerated every run, same as web/data) rather than CODE — see deploy.yml's
      # path exclusion, which exists for exactly this reason.
      - name: Run verified notebooks (guard before publish)
        if: steps.yearcheck.outputs.result != 'hold'
        run: python tools/run_verified_notebooks.py --out-dir web/verified

      # Temporal lens Phase 0 gate (docs/SPEC_temporal.md §0.3). Watches the
      # historical assessment file for the failure that produced the 2024/2025
      # defect: a settled year quietly losing accounts. Like every guard here it
      # sits BEFORE the status manifest, so a failure leaves last_checked
      # unbumped and the site keeps serving last-good data.
      #
      # SKIPS cleanly when data/raw/assessment_historical_by_hood.csv is absent,
      # so it is a no-op until the aggregate is part of the fetch step.
      # --write-archive captures the LIVE year into data/temporal_archive.json.
      # The current roll covers exactly one year, so a year not captured before
      # the roll advances is unrecoverable — and the capture has to happen on
      # ordinary runs, because a step that must be performed once, at a date
      # months away, is a step that does not happen. Previously-archived years
      # are frozen and never rewritten (src/load_temporal.write_archive).
      # ~74 kB per year; the commit step below picks it up like any other
      # regenerated file.
      - name: Check temporal years (guard before regenerating)
        if: steps.yearcheck.outputs.result != 'hold'
        run: python scripts/check_temporal_years.py --write-archive

      - name: Update status manifest (provenance + heartbeat)
        if: steps.yearcheck.outputs.result != 'hold'
        run: python scripts/generate_status.py

      - name: Update status manifest (holding window — set year-mismatch banner)
        if: steps.yearcheck.outputs.result == 'hold'
        env:
          BANNER: ${{ steps.yearcheck.outputs.banner }}
        run: python scripts/generate_status.py --banner "$BANNER"

      - name: Commit regenerated data + heartbeat if changed
        run: |
          git config user.name  "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage web/data — deploy.yml excludes web/data/**, so this is what
          # keeps a PAT-authenticated push from triggering a second deploy.
          git add web/data
          # ...and the rendered verified notebooks — DATA in the same sense as
          # web/data, just excluded from deploy.yml's trigger under its own path
          # (web/verified/**) rather than living outside web/ entirely.
          git add web/verified
          # ...and the temporal archive, which is NOT under web/. It has to be
          # committed or the capture dies with the runner and the live year is
          # lost at the next roll-forward — the exact loss the archive exists to
          # prevent, and it would fail silently. Safe for the same reason:
          # deploy.yml triggers on 'web/**' only, so data/** never fires it.
          git add data/temporal_archive.json
          # git is the change detector: status.json's last_checked bumps every
          # run (the heartbeat), so this normally has something to commit; a
          # same-day re-run with identical output legitimately has nothing.
          # Tested explicitly rather than with `|| echo`, because that form also
          # swallows REAL failures — an expired HEARTBEAT_TOKEN would fail the
          # push, report green, and take the heartbeat down silently. That is
          # the exact failure mode this heartbeat exists to prevent, so both
          # commit and push are allowed to fail the run.
          if git diff --cached --quiet; then
            echo "No changes to commit (same-day re-run with identical output)."
          else
            git commit -m "Auto-refresh map data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Two-build emit (docs/PLAN_public_release.md §2a): fan web/ out into
      # _site/ = public root + _site/full/ = specialist, sharing the just-
      # regenerated data/. Same shared script as deploy.yml — factor once. Runs
      # regardless of the hold state (we still deploy the committed tree in a
      # year-mismatch hold).
      - name: Build two-build site tree (public root + /full/ specialist)
        run: python scripts/build_site.py --src web --out _site

      # ⚠️ THE ONLY FRONT-END CHECK ON THE DATA PATH. Every guard above this line
      # checks the DATA (unmatched names, year alignment, value anchors, temporal
      # years); none of them looks at the rendered page, and this workflow
      # regenerates, commits AND deploys in a single run — so until this step, a
      # data change could alter what the site renders with nothing on fire.
      #
      # ⚠️ PLACED BEFORE upload-pages-artifact ON PURPOSE. A red gate here leaves
      # the live site serving the PREVIOUS good data instead of publishing a
      # broken render. The data commit has already landed by this point, which is
      # fine — it is in git and the data-side guards passed.
      #
      # ⚠️ verify-smoke.js asserts INVARIANTS ONLY, never a data value. That is
      # what makes it safe to run weekly: a pinned number here would go red on
      # every legitimate refresh (verify-temporal.js did exactly that on
      # 2026-08-01), and a check that cries wolf gets ignored. See its header.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install the verify harness
        working-directory: tools/profiling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ⚠️ BOTH BUILDS. The public root hides the full-only controls, so a check
      # run only against /full/ passes on states the public site does not have —
      # the failure PR #141 existed to fix.
      - name: Smoke-check the built render (gate before publish)
        run: |
          python -m http.server 8931 --directory _site &
          for _ in $(seq 30); do
            curl -sf http://localhost:8931/index.html >/dev/null && break
            sleep 1
          done
          node tools/profiling/verify-smoke.js http://localhost:8931/index.html
          node tools/profiling/verify-smoke.js http://localhost:8931/full/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: Tests

# THE MERGE GATE. Until 2026-08-28 there wasn't one: `pytest` existed in exactly
# one place — refresh.yml, a WEEKLY CRON — there was no pull_request workflow,
# and `master` was not branch-protected. So `deploy.yml` published to the live
# site on every push with zero test execution, and "746 passed" in a PR body
# attested to the author's laptop rather than to the merged state. That is the
# proxy-reading class one level up from the code (audit 2026-08-28, F3 —
# docs/FINDINGS_proxy_guards.md).
#
# ⚠️ THE GATE IS NOW ENFORCED, NOT ADVISORY — this comment said otherwise until
# 2026-09-21. `master` IS protected and requires the `test` context (verified
# against the branch-protection API, not assumed), so a PR cannot merge until
# this workflow passes, and force-pushes to master are refused. Two limits worth
# knowing: `enforce_admins` is OFF, so an admin can still merge past a red run
# deliberately; and no review is required, so this workflow is the ONLY thing
# standing between a PR and master.
#
# ⚠️ A PR showing "no checks reported" is usually the trigger LAGGING, not a
# missing run — measured 2026-09-21, a run appeared ~3 minutes after the PR
# opened, and a session that read the gap as a defect closed and reopened a PR
# for nothing. Query the head commit's check-runs before concluding a workflow
# did not fire.
#
# ⚠️ THIS DOES NOT REPLACE refresh.yml's OWN pytest STEP, and that step must
# stay. This gates the CHANGE; that one gates the weekly DATA PUBLISH, running
# immediately before download + regeneration so a broken suite holds the data
# path instead of corrupting it. Two different questions, two runs — deleting
# either re-opens a hole.
#
# Deliberately OFFLINE and secret-free: pytest and the citation guard read only
# committed files, so this needs no network, no Socrata, and no token. It stays
# fast (~15s) and cannot flake on an upstream outage — a merge gate that goes
# red for reasons unrelated to the change is a gate people learn to ignore.
# (That describes the `test` job. The `url-state` job below is the exception:
# it needs npm and a browser, and runs only on PRs that touch web/.)

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # tests/test_loaded_path.py reads git history; shallow = fails open

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Same guard the docs sweep automated (DECISIONS.md 2026-08-09): bans
      # line-number citations and fails on an unresolvable section pointer.
      # Offline, so it belongs on the merge gate rather than the weekly run.
      - name: Check doc citations
        run: python scripts/check_doc_citations.py

      # The money legend must decode to the number the colour ramp saturates at.
      # The verify scripts pin the legend STRING only, so the clamp could be moved
      # to $5,000 under a `$50k+` legend with all 923 tests green (measured
      # 2026-09-16). Offline — one file, no data. The DRIFT half runs in
      # refresh.yml, where the data is.
      - name: Check money legend matches its colour clamp
        run: python scripts/check_colour_clamps.py --legend-only

      # The decisions log's two write-time rules, enforced where a row is written:
      # a new row names a test that exists or is tagged [unverifiable]; a row that
      # supersedes an earlier one has that row marked in place. Offline.
      - name: Check decisions log
        run: python scripts/check_decisions_log.py

      # Ties the rates quoted in the lens blurbs to the JSON the pipeline reads.
      # Belongs on the MERGE gate, not the weekly run: a rate change is a code
      # edit, and refresh.yml would only catch it days later on a site already
      # serving the stale caption. Offline — both inputs are committed files.
      - name: Check cost copy matches the unit-cost file
        run: python scripts/check_cost_copy.py

  # The shareable URL hash (verify-url-state.js): every offered control is
  # clicked, the hash reopened in a fresh page, and the two screens compared.
  # Its failures are silent — a shared link opens the wrong view — and until
  # 2026-09-29 it ran only by hand (Peter chose "on web/ PRs", S203 option 3).
  #
  # PRs only, and only when the served artifact or the check itself changed:
  # too dear for doc PRs. The filter is its own job, not a job-level `paths:`,
  # so a PR it doesn't apply to still reports `url-state` as passed — a
  # path-filtered job that never starts would leave a required check pending
  # forever. web/data/** is deliberately included: a missing history file
  # changes which controls are offered, which is what this checks.
  url-state-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # the diff below needs the base branch

      - name: Does this PR touch the served artifact or the check?
        id: changed
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if echo "$files" | grep -qE '^(web/|scripts/build_site\.py$|tools/profiling/(verify-url-state\.js|package(-lock)?\.json)$|\.github/workflows/tests\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web/ change — URL-state check not needed."
          fi

  # SIX SHARDS IN PARALLEL (2026-10-02): one job ran ~8 min of walk serially;
  # the slowest shard is ~2.5 min. Measured split on the Oracle box: public
  # walk ~2.5 min / links ~1 min; full money ~1.3, services ~1.8, development
  # ~1.1, everything else + links ~1.8.
  # ⚠️ BOTH BUILDS: the full build's <base href="../"> is one of the defects
  # this catches, and the public build is the one readers share links from.
  # ⚠️ The last full shard is --views-except, not a list: a view added later
  # lands there and is walked unasked. Don't turn it into --views.
  url-state-shard:
    needs: url-state-changes
    if: needs.url-state-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # every shard reports, so one red doesn't hide another
      matrix:
        include:
          - { shard: public-walk,      page: index.html,                flags: "--part=walk" }
          - { shard: public-links,     page: index.html,                flags: "--part=links" }
          - { shard: full-money,       page: dev-build-full/index.html, flags: "--part=walk --views=money" }
          - { shard: full-services,    page: dev-build-full/index.html, flags: "--part=walk --views=services" }
          - { shard: full-development, page: dev-build-full/index.html, flags: "--part=walk --views=development" }
          - { shard: full-rest,        page: dev-build-full/index.html, flags: "--views-except=money,services,development" }
    name: url-state (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install the verify harness
        working-directory: tools/profiling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check the URL hash round-trips
        run: |
          python3 scripts/build_site.py --src web --out _site
          python3 -m http.server 8931 --directory _site &
          for _ in $(seq 30); do
            curl -sf http://localhost:8931/index.html >/dev/null && break
            sleep 1
          done
          node tools/profiling/verify-url-state.js http://localhost:8931/${{ matrix.page }} ${{ matrix.flags }}

  # The one name to require. Green when the filter said no run, red when the
  # filter itself failed or any shard did not pass (cancelled counts as red).
  url-state:
    needs: [url-state-changes, url-state-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed (or none were needed)
        run: |
          if [ "${{ needs.url-state-changes.result }}" != "success" ]; then
            echo "the change filter did not succeed: ${{ needs.url-state-changes.result }}"; exit 1
          fi
          if [ "${{ needs.url-state-changes.outputs.run }}" != "true" ]; then
            echo "No web/ change — URL-state check not needed."; exit 0
          fi
          echo "shards: ${{ needs.url-state-shard.result }}"
          [ "${{ needs.url-state-shard.result }}" = "success" ]

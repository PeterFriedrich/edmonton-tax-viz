name: Tests

# THE MERGE GATE. Until 2026-08-28 there wasn't one: `pytest` existed in exactly
# one place — refresh.yml, a WEEKLY CRON — there was no pull_request workflow,
# and `master` is not branch-protected. So `deploy.yml` published to the live
# site on every push with zero test execution, and "746 passed" in a PR body
# attested to the author's laptop rather than to the merged state. That is the
# proxy-reading class one level up from the code (audit 2026-08-28, F3 —
# docs/FINDINGS_proxy_guards.md).
#
# ⚠️ THIS DOES NOT REPLACE refresh.yml's OWN pytest STEP, and that step must
# stay. This gates the CHANGE; that one gates the weekly DATA PUBLISH, running
# immediately before download + regeneration so a broken suite holds the data
# path instead of corrupting it. Two different questions, two runs — deleting
# either re-opens a hole.
#
# Deliberately OFFLINE and secret-free: pytest and the citation guard read only
# committed files, so this needs no network, no Socrata, and no token. It stays
# fast (~15s) and cannot flake on an upstream outage — a merge gate that goes
# red for reasons unrelated to the change is a gate people learn to ignore.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Same guard the docs sweep automated (DECISIONS.md 2026-08-09): bans
      # line-number citations and fails on an unresolvable section pointer.
      # Offline, so it belongs on the merge gate rather than the weekly run.
      - name: Check doc citations
        run: python scripts/check_doc_citations.py

      # The money legend must decode to the number the colour ramp saturates at.
      # The verify scripts pin the legend STRING only, so the clamp could be moved
      # to $5,000 under a `$50k+` legend with all 923 tests green (measured
      # 2026-09-16). Offline — one file, no data. The DRIFT half runs in
      # refresh.yml, where the data is.
      - name: Check money legend matches its colour clamp
        run: python scripts/check_colour_clamps.py --legend-only

      # The decisions log's two write-time rules, enforced where a row is written:
      # a new row names a test that exists or is tagged [unverifiable]; a row that
      # supersedes an earlier one has that row marked in place. Offline.
      - name: Check decisions log
        run: python scripts/check_decisions_log.py

      # Ties the rates quoted in the lens blurbs to the JSON the pipeline reads.
      # Belongs on the MERGE gate, not the weekly run: a rate change is a code
      # edit, and refresh.yml would only catch it days later on a site already
      # serving the stale caption. Offline — both inputs are committed files.
      - name: Check cost copy matches the unit-cost file
        run: python scripts/check_cost_copy.py
